services:
  mongo:
    image: mongo:7
    container_name: novapos-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./pos-backend
    container_name: novapos-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/posdb
      JWT_SECRET: ${JWT_SECRET:-pos_secret_key}
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./pos-frontend
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    container_name: novapos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mongo-data:
